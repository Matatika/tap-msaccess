version: 1
send_anonymous_usage_stats: true
project_id: tap-msaccess
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: tap-msaccess
    namespace: tap_msaccess
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging
    settings:
    - name: database_file
    - name: connection_params
      kind: object
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
