### A CI workflow template that runs linting and python testing
### TODO: Modify as needed or as desired.

name: Test tap-msaccess

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/test.yml
    - sample_db/**
    - tap_msaccess/**
    - tests/**
    - pyproject.toml
    - uv.lock
  pull_request:
    paths:
    - .github/workflows/test.yml
    - sample_db/**
    - tap_msaccess/**
    - tests/**
    - pyproject.toml
    - uv.lock
  schedule:
  - cron: 0 9 * * *
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

permissions:
  contents: read  # read repository contents

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp

  pytest:
    name: Test
    needs: [build-package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
        config:
        - database-file: sample_db/Books.accdb
        - database-file: s3://tap-msaccess/Books.accdb
          connection-params: '{"anon": true}'
        - database-file: az://tap-msaccess/Books.accdb
          connection-params: '{"account_name": "matatikaartifacts","anon": true}'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Configure connection params
      if: ${{ matrix.config.connection-params }}
      env:
        CONNECTION_PARAMS: ${{ matrix.config.connection-params }}
      run: |
        echo "TAP_MSACCESS_CONNECTION_PARAMS=$CONNECTION_PARAMS" >> "$GITHUB_ENV"
    - name: Run Tox
      env:
        TAP_MSACCESS_DATABASE_FILE: ${{ matrix.config.database-file }}
      run: | # zizmor: ignore[template-injection]
        uvx --with=tox-uv tox -e ${{ matrix.python-version }}

  typing:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Run Tox
      run: >
        uvx
        --managed-python
        --with=tox-uv
        tox -e typing
